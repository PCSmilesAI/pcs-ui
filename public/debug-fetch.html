<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Fetch Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .error { background: #ffe6e6; }
        .success { background: #e6ffe6; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <h1>Debug: Frontend Fetch Test</h1>
    <button onclick="testFetch()">Test Fetch</button>
    <div id="results"></div>

    <script>
        async function testFetch() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="result">Loading...</div>';
            
            try {
                console.log('🔄 Starting fetch test...');
                
                const response = await fetch('/api/invoice-queue?limit=5000', {
                    cache: 'no-store',
                });
                
                console.log('📡 Response received:', response.status, response.statusText);
                
                const text = await response.text();
                console.log('📝 Raw response text length:', text.length);
                
                let data;
                try {
                    data = JSON.parse(text);
                    console.log('✅ JSON parsed successfully');
                } catch (parseError) {
                    console.error('❌ JSON parse error:', parseError);
                    resultsDiv.innerHTML = `
                        <div class="result error">
                            <strong>JSON Parse Error:</strong><br>
                            ${parseError.message}<br>
                            <strong>Raw response (first 500 chars):</strong><br>
                            <pre>${text.slice(0, 500)}</pre>
                        </div>
                    `;
                    return;
                }
                
                console.log('📊 Data structure:', {
                    ok: data.ok,
                    count: data.count,
                    invoicesLength: data.invoices?.length
                });
                
                if (!response.ok || !data?.ok) {
                    throw new Error(data?.error || `HTTP ${response.status}`);
                }

                const invoices = Array.isArray(data.invoices) ? data.invoices : [];
                console.log('📋 Invoices array length:', invoices.length);
                
                // Test filtering like ForMePage does
                const filteredInvoices = invoices.filter(invoice => {
                    const statusLc = String(invoice.status || '').toLowerCase();
                    const isNewish = ['new', 'uploaded', 'pending'].includes(statusLc);
                    const show = !invoice.approved && isNewish;
                    return show;
                });
                
                console.log('🎯 Filtered invoices (for ForMe page):', filteredInvoices.length);
                
                resultsDiv.innerHTML = `
                    <div class="result success">
                        <strong>✅ Fetch successful!</strong><br>
                        <strong>Response OK:</strong> ${response.ok}<br>
                        <strong>Data OK:</strong> ${data.ok}<br>
                        <strong>Total invoices:</strong> ${data.count}<br>
                        <strong>Invoices in response:</strong> ${invoices.length}<br>
                        <strong>Filtered for "For Me":</strong> ${filteredInvoices.length}<br>
                        <strong>Sample invoice statuses:</strong><br>
                        <pre>${invoices.slice(0, 5).map(inv => `${inv.id}: ${inv.status}, approved=${inv.approved}`).join('\n')}</pre>
                    </div>
                `;
                
            } catch (error) {
                console.error('❌ Fetch error:', error);
                resultsDiv.innerHTML = `
                    <div class="result error">
                        <strong>❌ Fetch Error:</strong><br>
                        ${error.message}<br>
                        <strong>Error details:</strong><br>
                        <pre>${JSON.stringify(error, null, 2)}</pre>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
